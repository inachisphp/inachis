framework:
    messenger:
        # Failure transport setup
        failure_transport: failed

        transports:
            # Production async transport using Doctrine DBAL queue
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route all Inachis background messages to async transport
            'Inachis\Message\CreateBackupMessage': async
            'Inachis\Message\RestoreBackupMessage': async
            'Inachis\Message\PruneOldBackupsMessage': async
            'Inachis\Message\CleanupLoginActivityMessage': async