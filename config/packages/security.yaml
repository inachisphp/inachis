security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: Inachis\Entity\User\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        health:
            pattern: ^/health$
            security: false

        incp:
            pattern: ^/incp(/|$)
            lazy: true
            stateless: false
            provider: app_user_provider
            user_checker: Inachis\Security\Authentication\UserChecker

            form_login:
                login_path: incp_account_login
                check_path: incp_account_login
                username_parameter: login[loginUsername]
                password_parameter: login[loginPassword]
                csrf_parameter: login[_token]
                default_target_path: incp_dashboard
                use_referer: true
                enable_csrf: true

            logout:
                path: incp_logout
                target: incp_account_login
                invalidate_session: true
                delete_cookies:
                    PHPSESSID: null

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            pattern: ^/
            stateless: true

    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS, ips: [127.0.0.1, ::1, 10.0.0.0/8, 192.168.0.0/16] }
        - { path: ^/incp/(login|login/totp|login/recovery|forgot-password|new-password/?.*?|logout|api/calculate-password-strength)$, roles: PUBLIC_ACCESS }
        - { path: ^/incp, roles: ROLE_USER }
        - { path: ^/.*, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
